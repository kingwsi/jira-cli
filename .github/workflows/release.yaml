name: Build Multi-Platform & Deploy to nextx.uk

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  DOWNLOAD_BASE_URL: "https://nextx.uk/jira-work"
  DEPLOY_TARGET_DIR: "/var/www/jira-work"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      # 1. 构建 Web 前端
      - name: Build Web Frontend
        run: |
          echo "==> 1. 构建 Web 前端静态产物..."
          cd web
          npm ci
          npm run build
          cd ..

      # 2. 跨平台交叉编译 Go 二进制并打包
      - name: Build Multi-Platform Binaries
        run: |
          echo "==> 2. 跨平台编译 Go 单二进制程序..."
          VERSION=${GITHUB_REF_NAME}
          if ! [[ "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Only stable vMAJOR.MINOR.PATCH tags may be published"
            exit 1
          fi
          BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          DATE_DISPLAY=$(date +"%Y-%m-%d")

          mkdir -p dist/latest

          # macOS (Apple Silicon arm64)
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w -X main.Version=${VERSION}" -o dist/jira main.go
          tar -czvf dist/latest/jira-darwin-arm64.tar.gz -C dist jira
          rm dist/jira

          # macOS (Intel amd64)
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w -X main.Version=${VERSION}" -o dist/jira main.go
          tar -czvf dist/latest/jira-darwin-amd64.tar.gz -C dist jira
          rm dist/jira

          # Linux (amd64)
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w -X main.Version=${VERSION}" -o dist/jira main.go
          tar -czvf dist/latest/jira-linux-amd64.tar.gz -C dist jira
          rm dist/jira

          # Windows (amd64)
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w -X main.Version=${VERSION}" -o dist/jira.exe main.go
          tar -czvf dist/latest/jira-windows-amd64.tar.gz -C dist jira.exe
          rm dist/jira.exe

          # 3. 生成版本元数据 version.json
          export VERSION BUILD_TIME
          python3 - <<'PYTHON'
          import hashlib, json, os, pathlib, shutil, subprocess
          latest = pathlib.Path('dist/latest')
          release = pathlib.Path('dist/releases') / os.environ['VERSION']
          release.mkdir(parents=True)
          checksums = {}
          for archive in latest.glob('*.tar.gz'):
              checksums[archive.name] = hashlib.sha256(archive.read_bytes()).hexdigest()
              shutil.copy2(archive, release / archive.name)
          metadata = dict(version=os.environ['VERSION'], built_at=os.environ['BUILD_TIME'],
                          summary=subprocess.check_output(['python3', 'deploy/release-summary.py', os.environ['VERSION']], text=True).strip(),
                          download_base=os.environ['DOWNLOAD_BASE_URL'] + '/releases/' + os.environ['VERSION'],
                          checksums=checksums)
          (latest / 'version.json').write_text(json.dumps(metadata, indent=2) + '\n')
          PYTHON

          # 4. 生成一键安装脚本 install.sh
          python3 - <<'PYTHON'
          import json, pathlib
          metadata = json.loads(pathlib.Path('dist/latest/version.json').read_text())
          cases = '\n'.join(f'  {name}) expected="{digest}" ;;' for name, digest in metadata['checksums'].items())
          script = pathlib.Path('deploy/install.sh').read_text()
          script = script.replace('__VERSION__', metadata['version']).replace('__CHECKSUM_CASES__', cases)
          pathlib.Path('dist/install.sh').write_text(script)
          PYTHON
          chmod +x dist/install.sh

          # 5. 组装下载落地页 index.html (注入版本号和时间)
          sed -e "s/__VERSION__/${VERSION}/g" \
              -e "s/RELEASE_DATE_PLACEHOLDER/${DATE_DISPLAY}/g" \
              deploy/index.html > dist/index.html

      # Job containers do not share the Nginx host filesystem. SSH is mandatory.
      - name: Publish to Nginx host via SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: bash deploy/publish.sh

      # 5. Telegram 成功通知
      - name: Send Telegram Notification on Success
        if: ${{ success() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [[ -z "$TELEGRAM_BOT_TOKEN" || -z "$TELEGRAM_CHAT_ID" ]]; then
            echo "Telegram notification not configured; skipping."
            exit 0
          fi
          VERSION=${GITHUB_REF_NAME}
          if ! [[ "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Only stable vMAJOR.MINOR.PATCH tags may be published"
            exit 1
          fi
          COMMIT_MSG=$(git log -1 --pretty=format:'%s')
          AUTHOR=$(git log -1 --pretty=format:'%an')
          BASE="${DOWNLOAD_BASE_URL}"

          MESSAGE="🚀 <b>Jira Workbench 编译与发布成功！</b>%0A%0A"
          MESSAGE="${MESSAGE}🏷 <b>版本号:</b> <code>${VERSION}</code>%0A"
          MESSAGE="${MESSAGE}👤 <b>发布者:</b> ${AUTHOR}%0A"
          MESSAGE="${MESSAGE}📝 <b>提交信息:</b> ${COMMIT_MSG}%0A%0A"
          MESSAGE="${MESSAGE}📦 <b>各平台下载包:</b>%0A"
          MESSAGE="${MESSAGE} • macOS (Apple Silicon): <a href=\"${BASE}/latest/jira-darwin-arm64.tar.gz\">下载</a>%0A"
          MESSAGE="${MESSAGE} • macOS (Intel): <a href=\"${BASE}/latest/jira-darwin-amd64.tar.gz\">下载</a>%0A"
          MESSAGE="${MESSAGE} • Windows (x64): <a href=\"${BASE}/latest/jira-windows-amd64.tar.gz\">下载</a>%0A"
          MESSAGE="${MESSAGE} • Linux (x64): <a href=\"${BASE}/latest/jira-linux-amd64.tar.gz\">下载</a>%0A%0A"
          MESSAGE="${MESSAGE}⚡ <b>一键安装命令:</b>%0A<code>curl -fsSL ${BASE}/install.sh | bash</code>%0A%0A"
          MESSAGE="${MESSAGE}🌐 <b>下载落地页:</b> ${BASE}/"

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true" \
            -d "text=${MESSAGE}"

      # 6. Telegram 失败告警
      - name: Send Telegram Notification on Failure
        if: ${{ failure() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [[ -z "$TELEGRAM_BOT_TOKEN" || -z "$TELEGRAM_CHAT_ID" ]]; then
            echo "Telegram notification not configured; skipping."
            exit 0
          fi
          VERSION=${GITHUB_REF_NAME:-latest}
          COMMIT_MSG=$(git log -1 --pretty=format:'%s')

          MESSAGE="❌ <b>Jira Workbench 构建或发布失败！</b>%0A%0A"
          MESSAGE="${MESSAGE}🏷 <b>分支/标签:</b> <code>${VERSION}</code>%0A"
          MESSAGE="${MESSAGE}📝 <b>提交信息:</b> ${COMMIT_MSG}%0A"
          MESSAGE="${MESSAGE}⚠️ 请登录 Gitea Actions 控制台查看详细构建日志。"

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "parse_mode=HTML" \
            -d "text=${MESSAGE}"
